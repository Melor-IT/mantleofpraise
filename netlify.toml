[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/about-us"
  to = "/en/about-us/"
  status = 301

[[redirects]]
  from = "/join-us"
  to = "/en/join-us/"
  status = 301

[[redirects]]
  from = "/our-vision"
  to = "/en/our-vision/"
  status = 301

[[redirects]]
  from = "/ANBI-information"
  to = "/en/ANBI-information/"
  status = 301

[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.ewcms.org; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
