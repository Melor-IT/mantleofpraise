[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/en"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/Home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:locale/Home"
  to = "/:locale/"
  status = 301
  force = true

[[redirects]]
  from = "/about-us"
  to = "/en/about-us/"
  status = 301

[[redirects]]
  from = "/join-us"
  to = "/en/join-us/"
  status = 301

[[redirects]]
  from = "/our-vision"
  to = "/en/our-vision/"
  status = 301

[[redirects]]
  from = "/ANBI-information"
  to = "/en/ANBI-information/"
  status = 301

# Security headers and static asset caching are generated in out/_headers by postbuild.
